# Merlin production-grade configuration example.

[server]
host = "0.0.0.0"
port = 7777

[clients.ollama]
format = "openai_chat"
base_url = "http://localhost:11434"
api_key_env = "OLLAMA_API_KEY"
max_retries = 0

[clients.openai]
format = "openai_chat"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
max_retries = 2

[clients.anthropic]
format = "anthropic_messages"
base_url = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"
max_retries = 2

[targets.qwen_ollama]
client = "ollama"
model = "qwen3.8-27b-uncensored-cyber-q4_k_m:latest"

[targets.gpt4]
client = "openai"
model = "gpt-4o"

[targets.claude_sonnet]
client = "anthropic"
model = "claude-3-5-sonnet-20241022"

[routes.default]
id = "default"
targets = ["qwen_ollama"]

[routes.default.algorithm]
type = "passthrough"
target = "qwen_ollama"

[routes.qwen_local]
id = "qwen_local"
targets = ["qwen_ollama"]

[routes.qwen_local.algorithm]
type = "passthrough"
target = "qwen_ollama"

[routes.cloud]
id = "cloud"
targets = ["gpt4", "claude_sonnet"]

[routes.cloud.algorithm]
type = "epsilon_greedy"
targets = ["gpt4", "claude_sonnet"]
epsilon = 0.15
