# Merlin production-grade configuration example.

[server]
host = "0.0.0.0"
port = 7777

[clients.openai]
format = "openai_chat"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
max_retries = 2

[clients.anthropic]
format = "anthropic_messages"
base_url = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"
max_retries = 2

[targets.gpt4]
client = "openai"
model = "gpt-4o"

[targets.claude_sonnet]
client = "anthropic"
model = "claude-3-5-sonnet-20241022"

[routes.default]
id = "default"
targets = ["gpt4", "claude_sonnet"]

[routes.default.algorithm]
type = "epsilon_greedy"
targets = ["gpt4", "claude_sonnet"]
epsilon = 0.15

[routes.passthrough]
id = "passthrough"
targets = ["gpt4"]

[routes.passthrough.algorithm]
type = "passthrough"
target = "gpt4"
